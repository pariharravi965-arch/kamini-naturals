<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamini Naturals Admin</title><style>body{font-family:system-ui;background:#f3f8f1;color:#173326;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #dfe9e0;border-radius:16px;padding:16px;margin:12px 0}input,select,button{padding:10px;border:1px solid #dfe9e0;border-radius:9px;font:inherit}button{background:#145c37;color:#fff;border:0;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.order{border-top:1px solid #eee;padding:14px 0}.muted{color:#6d7c74;font-size:13px}</style></head><body><div class="wrap"><h1>🌿 Kamini Naturals Admin</h1><div class="box"><label>Admin Token</label><input id="token" style="width:min(600px,100%)" type="password"><button onclick="loadOrders()">Load Orders</button><p class="muted">Token server ke ADMIN_TOKEN ke equal hona chahiye. Browser me token permanent store nahi hota.</p></div><div id="orders"></div></div><script>let rows=[];async function loadOrders(){const t=token.value.trim();const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok){orders.innerHTML='<div class="box">'+(d.error||'Unauthorized')+'</div>';return}rows=d;orders.innerHTML=d.map(o=>`<div class="box order"><h3>${o.order_id} — ${o.order_status}</h3><div>${o.name} | ${o.mobile} | ${o.pin}</div><div>${o.address}</div><p>₹${o.grand_total} • Payment: ${o.payment_status} • Method: ${o.payment_method}</p><div class="muted">${o.items.map(i=>i.name+' × '+i.qty).join(', ')}</div><div class="row" style="margin-top:8px"><select id="s_${o.order_id}">${['PLACED','PAID','PROCESSING','PACKED','SHIPPED','DELIVERED','CANCELLED','REFUND_PENDING','REFUNDED'].map(s=>`<option ${s===o.order_status?'selected':''}>${s}</option>`).join('')}</select><input id="c_${o.order_id}" placeholder="Courier" value="${o.courier||''}"><input id="t_${o.order_id}" placeholder="Tracking number" value="${o.tracking_number||''}"><button onclick="updateOrder('${o.order_id}')">Update</button></div></div>`).join('')||'<div class="box">No orders.</div>'}async function updateOrder(id){const t=token.value.trim();const r=await fetch('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({order_status:document.getElementById('s_'+id).value,courier:document.getElementById('c_'+id).value,tracking_number:document.getElementById('t_'+id).value})});if(r.ok)loadOrders();else alert((await r.json()).error||'Update failed')}</script></body></html>
